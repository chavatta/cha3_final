apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: togglemaster-evaluation
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/chavatta/cha3_final
    targetRevision: main
    path: gitops/apps/evaluation
  destination:
    server: https://kubernetes.default.svc
    namespace: togglemaster
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
